version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: revenue-recovery-db
    restart: always
    environment:
      POSTGRES_DB: revenue_recovery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
